<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NekoTask</title>
    <!-- link css -->
    <link rel="stylesheet" href="src/output.css" />
    <!-- custom fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <!-- google icon -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=dark_mode"
    />
    <!-- script js -->
    <script type="module" src="script/main.js"></script>
  </head>
  <body class="font-jakarta">
    <!-- main wrapper -->
    <div class="w-full h-screen bg-brand-ground-light py-10 px-5 active">
      <!-- main menu start -->
      <div
        class="main-menu show w-full h-full flex flex-col page"
        id="login-menu"
        data-target="login-menu"
      >
        <!-- level info and theme toggle -->
        <div class="topbar flex justify-between items-center">
          <p class="uppercase font-jakarta font-bold">level <span>1</span></p>
          <div
            class="theme-toggle p-1.5 cursor-pointer flex items-center justify-center rounded-full hover:bg-brand-ink-light transition-all hover:text-brand-ground-light"
          >
            <span class="material-symbols-outlined"> dark_mode </span>
          </div>
        </div>
        <!-- the header and title -->
        <div class="header mt-12">
          <p
            class="uppercase text-brand-violet-light font-bold tracking-widest mb-4"
          >
            welcome back, <span class="normal-case">to....</span>
          </p>
          <header class="text-brand-ink-light max-w-56">
            <h1 class="font-bricolage text-6xl font-bold">
              Neko <span class="font-instrument font-normal italic">Task</span>
            </h1>
          </header>
          <p class="font-instrument italic text-brand-ink-light/70 text-xl">
            there's many quest waiting!
          </p>
        </div>
        <!-- player stat and btn -->
        <div class="action mt-auto grid grid-cols-1 gap-3">
          <!-- player stat -->
          <div
            class="grid grid-cols-3 *:p-4 *:flex *:items-center *:justify-center rounded-3xl *:border-r-2 *:border-brand-ink-light/35 border-2 border-brand-ink-light/35 overflow-hidden"
          >
            <div class="bg-brand-card-light flex flex-col">
              <span class="font-bricolage font-bold text-xl">80</span>
              <p class="text-xs font-bold text-brand-ink-light/50">HP</p>
            </div>
            <div class="bg-brand-card-light flex flex-col">
              <span class="font-bricolage font-bold text-xl">7</span>
              <p class="text-xs font-bold text-brand-ink-light/50 capitalize">
                day streak
              </p>
            </div>
            <div class="bg-brand-card-light flex flex-col border-0!">
              <span class="font-bricolage font-bold text-xl">+100</span>
              <p class="text-xs font-bold text-brand-ink-light/50 capitalize">
                XP available
              </p>
            </div>
          </div>
          <!-- enter btn -->
          <div
            class="login w-full bg-brand-ink-light rounded-full py-2 font-bold text-brand-card-light text-center capitalize hover:brightness-75 transition-all cursor-pointer"
            id="enter-btn"
            data-target="feature-wrapper"
          >
            enter NekoTask
          </div>
          <a
            href=""
            class="text-center font-medium text-brand-ink-light/45 hover:text-brand-ink-light transition-all"
            >Rest Mode</a
          >
        </div>
      </div>
      <!-- main menu end-->
      <!-- feature wrapper -->
      <div
        class="page flex w-full h-full bg-red-400 *:p-4 *:py-5"
        id="feature-wrapper"
      >
        <!-- home start -->
        <div class="w-full h-full bg-sky-700" id="home-page">
          <header>
            <h2>LV <span>1</span></h2>
          </header>
        </div>
        <!-- home end -->
      </div>
      <!-- feature wrapper end -->
    </div>
    <!-- main wrapper end -->
  </body>
</html>
